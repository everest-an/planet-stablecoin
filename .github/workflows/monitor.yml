name: Protocol monitor

# Hourly invariant check. A failed run is the alert — a monitor that only writes to a log nobody
# reads is not monitoring. Checks: oracle freshness, reserve vs real balance, paused state, ownership
# still on the timelock (catches configuration drift after a redeploy), and any timelock proposal
# waiting to execute.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

concurrency:
  group: protocol-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relayer
    env:
      RPC: ${{ vars.EVM_RPC || 'https://arb1.arbitrum.io/rpc' }}
      CORE: ${{ vars.EVM_CORE || '0x61de052af7cb7dc957a07b1e6298152bb851cbbb' }}
      TIMELOCK: ${{ vars.EVM_TIMELOCK || '0xA1Fdb9F95210AF1d968872F6FC86F623A3e3017C' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node monitor.mjs
