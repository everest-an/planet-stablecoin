name: Protocol monitor

# Hourly invariant check. A failed run is the alert — a monitor that only writes to a log nobody
# reads is not monitoring. Checks: oracle freshness, reserve vs real balance, paused state, ownership
# still on the timelock (catches configuration drift after a redeploy), and any timelock proposal
# waiting to execute.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

concurrency:
  group: protocol-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relayer
    env:
      RPC: ${{ vars.EVM_RPC || 'https://sepolia-rollup.arbitrum.io/rpc' }}
      CORE: ${{ vars.EVM_CORE || '0x5b7537e800c4190f9Ee22FDBC1355Fbc0142952E' }}
      TIMELOCK: ${{ vars.EVM_TIMELOCK || '0x22B4f2CA13B76AC45295F5ce6C36f6Adf07a8C10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node monitor.mjs
