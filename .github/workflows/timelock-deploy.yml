name: Timelock deploy (testnet)

# Manual, testnet-only: deploys PlanetTimelock instances and exercises the delayed-owner
# flow on-chain (Propose -> Execute -> replay delivery), including a timelocked
# SetOwner round-trip on the live PlanetCore. Requires the TON_WALLET_MNEMONIC secret.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PlanetTimelock to TON testnet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ton
    steps:
      - uses: actions/checkout@v4

      - name: Install Acton
        run: |
          curl -LsSf https://github.com/ton-blockchain/acton/releases/latest/download/acton-installer.sh | sh
          echo "$HOME/.acton/bin" >> "$GITHUB_PATH"

      - name: Acton version
        run: acton --version

      - name: Build + wrappers
        run: |
          acton build
          acton wrapper --all

      - name: Import deployer wallet (testnet)
        run: acton wallet import --name deployer --version v4r2 --secure false --local "${{ secrets.TON_WALLET_MNEMONIC }}"

      - name: Deploy timelock + flow
        run: acton script scripts/deploy_timelock.tolk --net testnet
