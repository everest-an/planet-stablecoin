name: Relayer push (testnet)

# Runs the off-chain relayer in CI (the runner IP is not subject to the public RPC
# rate limits that a local run hits). Fetches live commodity prices, configures the
# basket, registers the signer, and pushes SignPriceUpdate(s) to PlanetCore.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily: refresh on-chain prices (idempotent; wallet needs gas)

jobs:
  push:
    name: Configure + push prices
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayer
    env:
      PLANET_CORE: kQAwzh3O-52-QBtB8JFFTjtNaKFhw-uJMkd-zdnoHoGibzcU
      ASSETS_JSON: assets.example.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Configure basket + register signer
        # Owner actions → the owner key (kept separate from the hot relayer key).
        env:
          RELAYER_MNEMONIC: ${{ secrets.TON_WALLET_MNEMONIC }}
        run: |
          node relayer.mjs configure
          node relayer.mjs register

      - name: Push live prices
        # The hot price-signing key. Separate from the owner so a leak here cannot touch
        # ownership or funds — it can only push prices, which the core validates anyway.
        env:
          RELAYER_MNEMONIC: ${{ secrets.RELAYER_MNEMONIC }}
        run: node relayer.mjs push
