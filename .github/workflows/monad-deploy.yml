name: Monad deploy

# The deployer key lives ONLY in the MONAD_DEPLOY_KEY repository secret. This workflow never prints
# it; it prints the derived ADDRESS (public by definition) so the wallet can be funded, and then
# deploys the contracts once it has gas.
#
# Required secrets:
#   MONAD_DEPLOY_KEY   the deployer private key (32-byte hex)
# Optional inputs (defaults are placeholders — set the current Monad testnet values):
#   rpc     e.g. https://testnet-rpc.monad.xyz
#   chain   e.g. 10143

on:
  workflow_dispatch:
    inputs:
      action:
        description: "address (just print the deployer address) or deploy (deploy the core stack)"
        required: true
        default: address
      rpc:
        description: "Monad testnet RPC URL"
        required: true
        default: "https://testnet-rpc.monad.xyz"
      chain:
        description: "Monad testnet chain id"
        required: true
        default: "10143"
      owner:
        description: "owner address for the deployed contracts (blank = the deployer)"
        required: false
      core:
        description: "configure only: PlanetCore address to configure (blank = the last Arbitrum deployment)"
        required: false
      threshold:
        description: "deploy only: SignedPriceOracle threshold (blank = 1, correct while one operator holds every key)"
        required: false

jobs:
  monad:
    name: Monad (${{ inputs.action }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monad
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: |
          mkdir -p lib
          if [ ! -d lib/forge-std ]; then
            git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          fi

      - name: Derive the deployer address (public) and check its balance
        env:
          KEY: 0x${{ secrets.MONAD_DEPLOY_KEY }}
          RPC: ${{ inputs.rpc }}
        run: |
          if [ -z "$KEY" ]; then echo "MONAD_DEPLOY_KEY secret is missing"; exit 1; fi
          ADDR=$(cast wallet address --private-key "$KEY")
          echo "deployer address: $ADDR"
          echo "DEPLOYER=$ADDR" >> "$GITHUB_ENV"
          BAL=$(cast balance "$ADDR" --rpc-url "$RPC" 2>/dev/null || echo "0")
          echo "balance (wei): $BAL"

      - name: Configure the 14-asset basket
        if: ${{ inputs.action == 'configure' }}
        env:
          KEY: 0x${{ secrets.MONAD_DEPLOY_KEY }}
          RPC: ${{ inputs.rpc }}
          CHAIN: ${{ inputs.chain }}
          CORE: ${{ inputs.core }}
        run: |
          forge script script/ConfigureBasket.s.sol:ConfigureBasket \
            --rpc-url "$RPC" --chain "$CHAIN" --private-key "$KEY" \
            --broadcast -vv

      - name: Deploy
        if: ${{ inputs.action == 'deploy' }}
        env:
          KEY: 0x${{ secrets.MONAD_DEPLOY_KEY }}
          RPC: ${{ inputs.rpc }}
          CHAIN: ${{ inputs.chain }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          # Use the deployer directly as owner. The previous version routed through an optional
          # input, and an unset input made the constructor-args list split into three values.
          OWNER="$DEPLOYER"
          echo "owner for the deployed contracts: $OWNER"

          # Constructor arguments are passed from Solidity (script/Deploy.s.sol), not through the
          # shell, because CLI constructor-args were being re-split (3 values for 2 parameters).
          # SIGNER_A wires a SignedPriceOracle with the deployer as its only signer and threshold 1:
          # the signed path is then deployed and exercised, and raising the threshold is a
          # setSigners() call once the keys actually live with different people.
          OWNER="$DEPLOYER" DELAY="60" SIGNER_A="$DEPLOYER" THRESHOLD="${THRESHOLD:-1}" \
          forge script script/Deploy.s.sol:Deploy \
            --rpc-url "$RPC" --chain "$CHAIN" --private-key "$KEY" \
            --broadcast -vv

          echo "Deployed. Token minter = Core, core token = token (wired in the script)."
