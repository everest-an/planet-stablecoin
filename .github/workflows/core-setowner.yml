name: Core owner -> new owner (testnet)

# Migrate PlanetCore ownership to a new owner — typically a TON MULTISIG wallet — THROUGH the
# current timelock: Propose -> delay -> Execute. Run it as whoever currently owns the timelock.
#
# Why a multisig: today the owner key is also the deploy key, so a single leaked key could change
# the basket, fees and ownership. Moving the owner (and then the timelock's own owner) to a
# 2-of-3 multisig removes that single point of failure. The 60s delay stays as the second gate.
#
# The new address is a workflow INPUT, so no code change is needed when it changes.

on:
  workflow_dispatch:
    inputs:
      new_owner:
        description: "New owner address (friendly form, e.g. a TON multisig wallet)"
        required: true
        type: string

jobs:
  setowner:
    name: Migrate core ownership through the timelock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayer
    env:
      PLANET_CORE: kQAwzh3O-52-QBtB8JFFTjtNaKFhw-uJMkd-zdnoHoGibzcU
      RELAYER_MNEMONIC: ${{ secrets.TON_WALLET_MNEMONIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Migrate owner through the timelock
        env:
          CORE_TIMELOCK: kQBo0345y-RGi49-7WWaWAHyyNtiWe-JrT44iO3G9Cyom6YK
          NEW_OWNER: ${{ inputs.new_owner }}
          TIMELOCK_WAIT_MS: "80000"
        run: node relayer.mjs setowner

      - name: Show the owner afterwards
        run: |
          node -e '
            const { TonClient, Address } = require("@ton/ton");
            (async () => {
              const c = new TonClient({ endpoint: "https://testnet.toncenter.com/api/v2/jsonRPC" });
              const r = await c.runMethod(Address.parse(process.env.PLANET_CORE), "owner");
              console.log("core.owner =", r.stack.readAddress().toString({ testOnly: true }));
            })().catch((e) => { console.error(String(e)); process.exit(1); });
          '
