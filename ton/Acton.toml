[package]
name = "planet"
description = "Planet — commodity purchasing-power index protocol on TON"
version = "0.1.0"
license = "Apache-2.0"

[toolchain]
# Pin the Acton CLI version (see https://ton-blockchain.github.io/acton/docs/acton-toml)
acton = "1.2.1"

[contracts.PlanetCore]
display-name = "Planet Core"
src = "contracts/planet_core.tolk"

# PLT token = standard TEP-74 Jetton, vendored from ton-blockchain/tolk-bench (01_jetton).
[contracts.JettonMinter]
display-name = "PLT Jetton Minter"
src = "contracts/jetton/JettonMinter.tolk"

[contracts.JettonWallet]
display-name = "PLT Jetton Wallet"
src = "contracts/jetton/JettonWallet.tolk"

[contracts.PlanetBasket]
display-name = "Planet Basket"
src = "contracts/planet_basket.tolk"

[contracts.PlanetBond]
display-name = "Planet Bond"
src = "contracts/planet_bond.tolk"

# Delayed-owner (timelock) — deploy and point PlanetCore.owner at it (SetOwner) so
# privileged actions need Propose -> delay -> Execute. Owner can be a TON multisig.
[contracts.PlanetTimelock]
display-name = "Planet Timelock"
src = "contracts/planet_timelock.tolk"

# Tokenized ETF fund (Phase 2): deposit + custodian-confirmed mint at NAV.
[contracts.PlanetFund]
display-name = "Planet Fund"
src = "contracts/planet_fund.tolk"

# PLTG governance: staking + pro-rata fee dividends (25% bucket) + parameter voting.
[contracts.PlanetGov]
display-name = "Planet Gov (PLTG)"
src = "contracts/planet_gov.tolk"

[build]
out-dir = "build"
output-abi = "build/abi"

[wrappers.tolk]
output-dir = "contracts/wrappers"

[import-mappings]
"@acton" = ".acton"
"@contracts" = "contracts"
"@tests" = "contracts/tests"
"@wrappers" = "contracts/wrappers"
"@gen" = "gen"

# Coverage gate — baseline ratchet. Current blended score = 90.6% (lines 95.5%).
# Raise this floor as tests are added; never lower it.
[test.coverage]
enabled = true
minimum-percent = 90
